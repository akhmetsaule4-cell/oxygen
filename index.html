/* ---------- Калькулятор ---------- */
function num(v,d){ var x=parseFloat(String(v).replace(',','.')); return isFinite(x)&&x>=0?x:d; }
function calc(){
  var t=D[S.lang], f=function(n,d){return (n/1000).toLocaleString(t.fmt,{minimumFractionDigits:d,maximumFractionDigits:d});};
  var cyl=num(S.cyl,0), price=num(S.price,0), tariff=num(S.tariff,0), load=Math.min(100,Math.max(0,num(S.load,100)));
  var cylY=cyl*price*365, opex=196*(load/100)*24*365*tariff+26987, sav=cylY-opex, mx=Math.max(cylY,opex,1);
  var g=function(id){return document.getElementById(id);};
  g('o-cyl').textContent=f(cylY,1); g('o-on').textContent=f(opex,1); g('o-sav').textContent=f(sav,1);
  g('b-cyl').style.width=Math.max(2,Math.round(cylY/mx*100))+'%'; g('b-on').style.width=Math.max(2,Math.round(opex/mx*100))+'%';
  g('load-lbl').textContent=Math.round(load)+' %';
  if(sav>0){ g('o-pay').textContent=(1169415/sav).toLocaleString(t.fmt,{minimumFractionDigits:1,maximumFractionDigits:1}); g('o-note').textContent=t.c_note; }
  else { g('o-pay').textContent='—'; g('o-note').textContent=t.c_neg; }
}
